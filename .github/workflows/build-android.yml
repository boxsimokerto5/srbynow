name: Build Release APK & AAB (Arek Surabaya)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - ".signing/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Signed APK & AAB Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --update > /dev/null || true
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Siapkan File Konfigurasi Lokal (.env & debug.keystore)
        run: |
          [ -f .env ] || cp .env.example .env
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Buat atau Pulihkan Release Signature Key (Otomatis & Permanen)
        id: signing
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail

          ENCRYPTED_KEYSTORE=".signing/release-key.jks.gpg"
          FINGERPRINT_FILE=".signing/SHA-FINGERPRINTS.txt"
          TEMP_KEYSTORE="${RUNNER_TEMP}/my-upload-key.jks"

          # Password internal JKS (32 karakter, konsisten untuk repositori ini)
          INTERNAL_JKS_PASS="$(printf '%s' "arek-surabaya-jks:${REPO_ID}:${OWNER_ID}" | sha256sum | cut -c1-32)"
          echo "::add-mask::${INTERNAL_JKS_PASS}"

          # Passphrase enkripsi GPG otomatis (dipakai bila user belum membuat secret KEYSTORE_PASSPHRASE)
          AUTO_GPG_PASS="$(printf '%s' "arek-surabaya-gpg:${REPO_ID}:${OWNER_ID}" | sha256sum | cut -c1-48)"
          echo "::add-mask::${AUTO_GPG_PASS}"

          if [ -n "${KEYSTORE_PASSPHRASE}" ]; then
            ACTIVE_GPG_PASS="${KEYSTORE_PASSPHRASE}"
            USING_CUSTOM_SECRET="true"
          else
            ACTIVE_GPG_PASS="${AUTO_GPG_PASS}"
            USING_CUSTOM_SECRET="false"
            echo "::notice::Mode Otomatis Aktif: Keystore dienkripsi otomatis tanpa perlu mengatur secret manual. (Opsional: Anda tetap bisa menambahkan secret KEYSTORE_PASSPHRASE kapan saja)."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_to_vault() {
            local tmp_index="${RUNNER_TEMP}/vault.index"
            rm -f "${tmp_index}"
            GIT_INDEX_FILE="${tmp_index}" git update-index --add "${ENCRYPTED_KEYSTORE}" "${FINGERPRINT_FILE}"
            local tree_sha
            tree_sha="$(GIT_INDEX_FILE="${tmp_index}" git write-tree)"
            local commit_sha
            commit_sha="$(git commit-tree "${tree_sha}" -m "chore(signing): store permanent release keystore [skip ci]")"
            git push --force origin "${commit_sha}:refs/heads/signing-vault"
            rm -f "${tmp_index}"
          }

          persist_to_branch() {
            if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              git add "${ENCRYPTED_KEYSTORE}" "${FINGERPRINT_FILE}"
              if ! git diff --cached --quiet; then
                git commit -m "chore(signing): persist encrypted Android release keystore [skip ci]"
                git push origin "HEAD:refs/heads/${TARGET_BRANCH}" || {
                  git pull --rebase origin "${TARGET_BRANCH}"
                  git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
                }
              fi
            fi
          }

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            TARGET_BRANCH="${DEFAULT_BRANCH}"
          fi

          # Sinkronisasi terbaru dari branch agar tidak membuat key ganda bila ada commit baru
          git fetch origin "${TARGET_BRANCH}" || true
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git rebase "origin/${TARGET_BRANCH}" || git reset --hard "origin/${TARGET_BRANCH}"
          fi

          mkdir -p .signing

          # Pulihkan dari branch cadangan 'signing-vault' apabila push baru menimpa folder .signing di branch utama
          VAULT_RESTORED="false"
          if [ ! -f "${ENCRYPTED_KEYSTORE}" ]; then
            if git fetch origin signing-vault:refs/remotes/origin/signing-vault 2>/dev/null; then
              if git checkout refs/remotes/origin/signing-vault -- "${ENCRYPTED_KEYSTORE}" "${FINGERPRINT_FILE}" 2>/dev/null; then
                echo "🔄 Memulihkan keystore permanen dari branch cadangan signing-vault..."
                VAULT_RESTORED="true"
              fi
            fi
          fi

          if [ ! -f "${ENCRYPTED_KEYSTORE}" ]; then
            echo "🔑 Build Pertama terdeteksi: Membuat Release Signature Key baru..."

            keytool -genkeypair -v \
              -keystore "${TEMP_KEYSTORE}" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "${INTERNAL_JKS_PASS}" \
              -keypass "${INTERNAL_JKS_PASS}" \
              -dname "CN=Arek Surabaya, OU=Mobile, O=ArekSurabaya, L=Surabaya, ST=Jawa Timur, C=ID"

            # Enkripsi keystore dengan AES-256 GPG
            printf '%s' "${ACTIVE_GPG_PASS}" | gpg \
              --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 \
              --output "${ENCRYPTED_KEYSTORE}" \
              "${TEMP_KEYSTORE}"

            # Simpan fingerprint publik (SHA-1 & SHA-256) untuk referensi Play Store / OAuth
            {
              echo "Arek Surabaya - Public Signing Certificate Fingerprints"
              echo "Alias: upload"
              echo "-------------------------------------------------------"
              keytool -list -v \
                -keystore "${TEMP_KEYSTORE}" \
                -storepass "${INTERNAL_JKS_PASS}" \
                -alias upload | grep -E "Owner:|Issuer:|Valid from:|SHA1:|SHA256:" || true
            } > "${FINGERPRINT_FILE}"

            # Simpan permanen ke branch cadangan 'signing-vault' dan branch utama
            save_to_vault
            persist_to_branch

            echo "✅ Keystore baru berhasil dienkripsi dan disimpan permanen ke ${ENCRYPTED_KEYSTORE}"
          else
            echo "🔒 Keystore permanen ditemukan (${ENCRYPTED_KEYSTORE}): Mendekripsi signature key yang sama..."

            NEED_REENCRYPT="false"
            if printf '%s' "${ACTIVE_GPG_PASS}" | gpg \
              --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --decrypt \
              --output "${TEMP_KEYSTORE}" \
              "${ENCRYPTED_KEYSTORE}" 2>/dev/null; then
              echo "✅ Keystore berhasil dipulihkan tanpa mengubah signature."
            elif [ "${USING_CUSTOM_SECRET}" = "true" ] && printf '%s' "${AUTO_GPG_PASS}" | gpg \
              --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --decrypt \
              --output "${TEMP_KEYSTORE}" \
              "${ENCRYPTED_KEYSTORE}" 2>/dev/null; then
              echo "🔐 Keystore otomatis lama terdeteksi: Mengenkripsi ulang keystore yang SAMA dengan secret KEYSTORE_PASSPHRASE Anda..."
              printf '%s' "${KEYSTORE_PASSPHRASE}" | gpg \
                --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 \
                --symmetric --cipher-algo AES256 \
                --output "${ENCRYPTED_KEYSTORE}" \
                "${TEMP_KEYSTORE}"
              NEED_REENCRYPT="true"
            else
              echo "::error::Gagal mendekripsi ${ENCRYPTED_KEYSTORE}. Jika Anda menggunakan secret KEYSTORE_PASSPHRASE, pastikan nilainya tidak berubah."
              exit 1
            fi

            if [ "${NEED_REENCRYPT}" = "true" ]; then
              save_to_vault
            fi
            if [ "${VAULT_RESTORED}" = "true" ] || [ "${NEED_REENCRYPT}" = "true" ]; then
              persist_to_branch
            fi
          fi

          # Verifikasi alias 'upload' valid di dalam keystore
          keytool -list \
            -keystore "${TEMP_KEYSTORE}" \
            -storepass "${INTERNAL_JKS_PASS}" \
            -alias upload > /dev/null

          echo "keystore_path=${TEMP_KEYSTORE}" >> "${GITHUB_OUTPUT}"
          echo "keystore_password=${INTERNAL_JKS_PASS}" >> "${GITHUB_OUTPUT}"

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
          KEY_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Siapkan Output & Verifikasi Signature
        id: package_info
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
        run: |
          mkdir -p release-outputs

          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SOURCE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "${APK_SOURCE}" ] || [ -z "${AAB_SOURCE}" ]; then
            echo "::error::File APK atau AAB release tidak ditemukan!"
            exit 1
          fi

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          APK_DEST="release-outputs/Arek-Surabaya-v${VERSION_NAME}-release.apk"
          AAB_DEST="release-outputs/Arek-Surabaya-v${VERSION_NAME}-release.aab"

          cp "${APK_SOURCE}" "${APK_DEST}"
          cp "${AAB_SOURCE}" "${AAB_DEST}"

          SHA256_FP=$(keytool -list -v -keystore "${KEYSTORE_PATH}" -storepass "${STORE_PASSWORD}" -alias upload | grep "SHA256:" | head -n 1 | xargs || true)

          {
            echo "## 📦 Hasil Build Release — Arek Surabaya"
            echo "- **Application ID:** \`com.areksurabaya.gecckosurabaya\`"
            echo "- **Version:** \`${VERSION_NAME}\`"
            echo "- **APK File:** \`$(basename "${APK_DEST}")\`"
            echo "- **AAB File:** \`$(basename "${AAB_DEST}")\`"
            echo "- **Certificate Fingerprint:** \`${SHA256_FP}\`"
            echo ""
            echo "> Signature key dijamin konsisten secara permanen dari \`.signing/release-key.jks.gpg\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Artifact APK (Siap Install)
        uses: actions/upload-artifact@v4
        with:
          name: Arek-Surabaya-APK
          path: release-outputs/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Artifact AAB (Siap Upload Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Arek-Surabaya-AAB
          path: release-outputs/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish ke GitHub Releases (Khusus Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-outputs/*.apk
            release-outputs/*.aab
          generate_release_notes: true

      - name: Bersihkan Keystore Sementara dari Runner
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/my-upload-key.jks"
